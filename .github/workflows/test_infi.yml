name: Infisical Connection Test

on:
  push:

jobs:
  test-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install infisical

      - name: Authenticate with Infisical
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical login --method=universal-auth --token $INFISICAL_TOKEN

      - name: Pull secret from Infisical
        run: |
          infisical run --env=dev -- echo "Secret loaded successfully"

      - name: Verify connection (safe check)
        run: |
          echo "✅ Infisical connection successful"