name: Infisical CI Test

on:
  push:

jobs:
  test-infisical:
    runs-on: ubuntu-latest

    steps:
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install infisical

      - name: Login to Infisical
        env:
          INFI_PRO_TOKEN: ${{ secrets.INFI_PRO_TOKEN }}
        run: |
          infisical login --method=universal-auth --token $INFI_PRO_TOKEN

      - name: Fetch secret safely
        run: |
          infisical run --env=development -- printenv API_KEY

      - name: Confirm success
        run: echo "✅ Infisical integration working"