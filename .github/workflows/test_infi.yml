name: Infisical Connection Test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install infisical

      - name: Login to Infisical
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical login --method=service-token --token $INFISICAL_TOKEN

      - name: Fetch secret safely
        run: |
          infisical run --env=dev -- bash -c 'echo "API_KEY is: $API_KEY"'

      - name: Success message
        run: echo "✅ Infisical connection successful"