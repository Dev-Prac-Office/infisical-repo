name: Demo Secret Check

on:
  push:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret exists
        run: |
          if [ -z "${{ secrets.DEMO_API_KEY }}" ]; then
            echo "❌ Secret is NOT set"
            exit 1
          else
            echo "✅ Secret is set"
          fi